<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updates — TheUnlockedWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="icon" href="../assets/resources/favicon.ico">
  <style>
    /* ��─ Page header ────────────────────────── */
    .page-header {
      padding: 52px 0 44px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.8rem);
      line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(140deg, #fff 0%, #f5f3ff 20%, var(--gold) 48%, var(--gold-soft) 68%, #fff 88%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 7s 0.4s linear infinite, fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .page-sub {
      font-size: 0.88rem;
      color: var(--sub);
      font-weight: 500;
      animation: fadeUp 0.6s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── Update items ────────────────────────── */
    .updates-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeUp 0.6s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .update-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 24px;
      transition: border-color 0.22s, background 0.22s, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s;
    }

    .update-item:hover {
      border-color: var(--border-h);
      background: var(--card-h);
      transform: translateX(5px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .update-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .update-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-gold {
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .dot-purple {
      background: var(--purple);
      box-shadow: 0 0 10px var(--purple);
    }

    .dot-green {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .update-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      flex: 1;
    }

    .update-status-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .badge-completed {
      background: rgba(52, 211, 153, 0.13);
      color: var(--green);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .badge-upcoming {
      background: rgba(245, 158, 11, 0.13);
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-in-progress {
      background: rgba(88, 101, 242, 0.13);
      color: var(--purple);
      border: 1px solid rgba(88, 101, 242, 0.3);
    }

    .update-description {
      font-size: 0.95rem;
      color: var(--sub);
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .update-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ── Admin edit button ────────────────────── */
    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.1);
      color: var(--gold);
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .edit-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      transform: translateY(-1px);
    }

    /* ── Modal ────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 94%;
      max-width: 500px;
      position: relative;
    }

    .modal h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 18px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s, transform 0.15s;
    }

    .modal-close:hover {
      color: #f87171;
      transform: rotate(90deg);
    }

    .modal label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    .modal label:first-of-type {
      margin-top: 0;
    }

    .modal input,
    .modal textarea,
    .modal select {
      width: 100%;
      background: #0d0d1b;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.88rem;
      transition: border-color 0.15s;
      resize: vertical;
    }

    .modal input:focus,
    .modal textarea:focus,
    .modal select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }

    .modal-btns button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn-confirm {
      background: var(--gold);
      color: #000;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.07);
      color: var(--sub);
    }

    /* ── Admin badge ────────────────────────── */
    .admin-badge {
      position: fixed;
      top: calc(var(--nav-h, 58px) + 10px);
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .admin-pill {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 99px;
      font-family: 'Manrope', sans-serif;
      border: 1px solid;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .admin-pill.login {
      color: var(--muted);
      border-color: var(--border);
      background: none;
    }

    .admin-pill.login:hover {
      color: var(--sub);
      border-color: var(--border-h);
      background: rgba(255, 255, 255, 0.04);
    }

    .admin-pill.active {
      color: var(--gold);
      border-color: rgba(245, 158, 11, 0.35);
      background: var(--gold-gl);
    }

    .admin-pill.active:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .admin-badge {
        right: 10px;
      }

      .modal {
        width: 92%;
      }

      .update-header {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Nav -->
  <nav class="nav">
    <a href="../" class="nav-brand">TUW</a>
    <div class="nav-divider"></div>
    <div class="nav-links">
      <a href="../">Home</a>
      <a href="../videos/">Videos</a>
      <a href="../games/">Games</a>
      <a href="../suggestions/">Suggestions</a>
      <a href="../chat/">Chat</a>
    </div>
    <div class="nav-socials">
      <a href="https://www.youtube.com/channel/UCi8DgxMDGJ-Qsjqfdi-uoIw" class="nav-pill nav-pill-yt" target="_blank">
        <i class="fa-brands fa-youtube"></i> YouTube
      </a>
      <a href="https://discord.gg/vBMNDBTFn" class="nav-pill nav-pill-dc" target="_blank">
        <i class="fa-brands fa-discord"></i> Discord
      </a>
    </div>
  </nav>

  <div class="wrap">
    <header class="page-header">
      <div class="chip"><span class="chip-dot"></span>Site Updates</div>
      <h1 class="page-title">Updates & Notes</h1>
      <p class="page-sub">Latest news, completed features, and upcoming improvements to TheUnlockedWeb.</p>
    </header>

    <div class="updates-container" id="updatesContainer"></div>
  </div>

  <footer>
    <span class="f-brand">TheUnlockedWeb</span>
    <span class="f-copy">© 2026 EthanUnlocked's gaming hits</span>
    <div class="f-links">
      <a href="https://github.com/TheUnlockedWeb/theunlockedweb.github.io" target="_blank">
        <i class="fa-brands fa-github"></i> Source
      </a>
    </div>
  </footer>

  <!-- Admin Badge -->
  <div class="admin-badge">
    <button class="admin-pill login" id="adminBtn">
      <i class="fa-solid fa-shield-halved"></i> Admin
    </button>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
      <h3><i class="fa-solid fa-pen" style="color:var(--gold);margin-right:8px"></i>Edit Update</h3>
      <label>Title</label>
      <input type="text" id="editTitle" maxlength="80">
      <label>Description</label>
      <textarea id="editDescription" rows="4" maxlength="300"></textarea>
      <label>Status</label>
      <select id="editStatus">
        <option value="completed">Completed</option>
        <option value="in-progress">In Progress</option>
        <option value="upcoming">Upcoming</option>
      </select>
      <label>Color</label>
      <select id="editColor">
        <option value="gold">Gold</option>
        <option value="purple">Purple</option>
        <option value="green">Green</option>
      </select>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
        <button class="btn-confirm" id="editSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div class="modal-overlay" id="adminLoginModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('adminLoginModal')">×</button>
      <h3><i class="fa-solid fa-shield-halved" style="color:var(--gold);margin-right:8px"></i>Admin Login</h3>
      <label>Password</label>
      <input type="password" id="adminPassword" autocomplete="off">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('adminLoginModal')">Cancel</button>
        <button class="btn-confirm" id="adminLoginBtn">Login</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // EDITABLE UPDATES DATA — CHANGE NOTES HERE
    // ═══════════════════════════════════════════════════════════
    const UPDATES = [
      {
        id: 1,
        title: 'YouTube Videos Integration',
        description: 'Auto-fetching video and shorts data from your YouTube channel every 6 hours. Videos now display with proper filtering.',
        status: 'completed', // completed, in-progress, upcoming
        color: 'green', // gold, purple, green
        date: 'May 10, 2026',
      },
      {
        id: 2,
        title: 'Shorts Detection System',
        description: 'Working on better detection of YouTube Shorts vs regular short videos. Will properly distinguish real shorts from regular uploads under 60 seconds.',
        status: 'in-progress',
        color: 'purple',
        date: 'May 13, 2026',
      },
      {
        id: 3,
        title: 'New Games Section',
        description: 'Adding 2 new games to the Games page. Removing 1 older game. Site currently under maintenance for these updates.',
        status: 'in-progress',
        color: 'purple',
        date: 'May 10, 2026',
      },
      {
        id: 4,
        title: 'Mobile Optimization',
        description: 'Full mobile redesign coming soon. Better touch interactions and responsive layouts for all screen sizes.',
        status: 'upcoming',
        color: 'gold',
        date: 'Coming Soon',
      },
      {
        id: 5,
        title: 'Dark Mode Toggle',
        description: 'Users will be able to switch between dark and light theme. Theme preference will be saved locally.',
        status: 'upcoming',
        color: 'gold',
        date: 'Coming Soon',
      },
    ];

    const ADMIN_PASSWORD_HASH = '286755fad04869ca523320acce0dc6a4'; // MD5 hash of "admin"
    let isAdmin = false;
    let editingId = null;

    // ═══════════════════════════════════════════════════════════
    // UTILITIES
    // ═══════════════════════════════════════════════════════════
    function openModal(modalId) {
      document.getElementById(modalId).classList.add('open');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function hashPassword(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // ═══════════════════════════════════════════════════════════
    // RENDER UPDATES
    // ═══════════════════════════════════════════════════════════
    function renderUpdates() {
      const container = document.getElementById('updatesContainer');
      container.innerHTML = UPDATES.map(
        (u) => `
        <div class="update-item">
          <div class="update-header">
            <div class="update-dot dot-${u.color}"></div>
            <div class="update-title">${u.title}</div>
            <span class="update-status-badge badge-${u.status}">
              ${u.status === 'completed' ? '✓ Done' : u.status === 'in-progress' ? '⟳ In Progress' : '→ Upcoming'}
            </span>
            ${isAdmin ? `<button class="edit-btn" onclick="editUpdate(${u.id})"><i class="fa-solid fa-pen"></i> Edit</button>` : ''}
          </div>
          <p class="update-description">${u.description}</p>
          <div class="update-meta">
            <div class="meta-item">
              <i class="fa-regular fa-calendar"></i> ${u.date}
            </div>
          </div>
        </div>
      `
      ).join('');
    }

    // ═══════════════════════════════════════════════════════════
    // ADMIN FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function setAdmin(val) {
      isAdmin = val;
      const btn = document.getElementById('adminBtn');
      if (val) {
        btn.className = 'admin-pill active';
        btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Admin ✓';
        btn.onclick = logoutAdmin;
      } else {
        btn.className = 'admin-pill login';
        btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Admin';
        btn.onclick = () => openModal('adminLoginModal');
      }
      renderUpdates();
    }

    function logoutAdmin() {
      setAdmin(false);
      showToast('Logged out of admin');
    }

    document.getElementById('adminBtn').onclick = () => openModal('adminLoginModal');

    document.getElementById('adminLoginBtn').addEventListener('click', async () => {
      const pass = document.getElementById('adminPassword').value;
      if (!pass) {
        showToast('Enter password');
        return;
      }
      const hash = await hashPassword(pass);
      if (hash === ADMIN_PASSWORD_HASH) {
        closeModal('adminLoginModal');
        document.getElementById('adminPassword').value = '';
        setAdmin(true);
        showToast('Admin mode enabled 🛡️');
      } else {
        showToast('❌ Invalid password');
      }
    });

    document.getElementById('adminPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('adminLoginBtn').click();
    });

    function editUpdate(id) {
      const update = UPDATES.find((u) => u.id === id);
      if (!update) return;
      editingId = id;
      document.getElementById('editTitle').value = update.title;
      document.getElementById('editDescription').value = update.description;
      document.getElementById('editStatus').value = update.status;
      document.getElementById('editColor').value = update.color;
      openModal('editModal');
    }

    document.getElementById('editSaveBtn').addEventListener('click', () => {
      const update = UPDATES.find((u) => u.id === editingId);
      if (!update) return;
      update.title = document.getElementById('editTitle').value.trim();
      update.description = document.getElementById('editDescription').value.trim();
      update.status = document.getElementById('editStatus').value;
      update.color = document.getElementById('editColor').value;
      closeModal('editModal');
      renderUpdates();
      showToast('Update saved! 📝');
    });

    // Initial render
    renderUpdates();
  </script>
</body>
</html>
