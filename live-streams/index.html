<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Streams — TheUnlockedWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="icon" href="../assets/resources/favicon.ico">
  <style>
    /* ── Page header ─────────────────────── */
    .page-header {
      padding: 52px 0 30px;
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 12px;
    }
    .page-title {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.8rem);
      line-height: 1; letter-spacing: -0.03em;
      background: linear-gradient(140deg, #fff 0%, #f5f3ff 20%, var(--gold) 48%, var(--gold-soft) 68%, #fff 88%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 7s .4s linear infinite, fadeUp .7s cubic-bezier(.22,1,.36,1) both;
    }
    .page-sub {
      font-size: .88rem; color: var(--sub); font-weight: 500;
      animation: fadeUp .6s .15s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Stream Tabs Navigation ──────────── */
    .stream-tabs {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      animation: fadeUp .6s .18s cubic-bezier(.22,1,.36,1) both;
    }
    .stream-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); color: var(--muted);
      padding: 10px 18px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      position: relative; flex-shrink: 0; transition: all 0.2s ease;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); border-color: var(--border-h); }
    .tab-btn.active { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); color: var(--gold); text-shadow: 0 0 10px var(--gold-soft); }

    .tab-pulse-indicator {
      display: none; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; position: absolute; top: 6px; right: 6px; box-shadow: 0 0 8px #ef4444; animation: pulse-glow 1.5s infinite;
    }

    /* Suggestions Counter Badge */
    .tab-counter-badge {
      display: inline-flex; align-items: center; justify-content: center; background: var(--gold); color: #000;
      font-size: 0.68rem; font-family: monospace; font-weight: 800; min-width: 18px; height: 18px; border-radius: 50%; padding: 0 4px; margin-left: 2px;
      transition: opacity 0.2s;
    }

    /* ── Streams Container Layout Grid ───── */
    .streams-container { display: flex; flex-direction: column; gap: 20px; animation: fadeUp .6s .2s cubic-bezier(.22,1,.36,1) both; }
    .stream-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .stream-top-row { display: flex; gap: 24px; }
    @media (max-width: 768px) { .stream-top-row { flex-direction: column; gap: 16px; } }

    .stream-thumb-wrapper { position: relative; width: 280px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #000; flex-shrink: 0; }
    .stream-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .stream-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .stream-header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
    .stream-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.2rem; color: var(--text); flex: 1; }
    .stream-status-badge { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }

    /* ── Theater Embedding Container Workspace ── */
    .live-theater-workspace { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #06060c; }
    .live-theater-workspace.no-chat { grid-template-columns: 1fr; }
    .video-player-frame { width: 100%; aspect-ratio: 16/9; background: #000; border: none; display: block; }
    .chat-embed-frame { width: 100%; height: 100%; min-height: 360px; background: #0a0a14; border: none; display: block; border-left: 1px solid var(--border); }

    /* ── Suggestions Board Styles ──────────────── */
    .tab-board-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; }
    .board-input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; background: rgba(255,255,255,0.01); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .board-row-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
    .board-input { background: #0d0d1b; border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 10px 14px; font-family: 'Manrope', sans-serif; font-size: 0.85rem; }
    .board-input:focus { outline: none; border-color: var(--gold); }
    .input-name { width: 200px; }
    .input-msg { flex: 1; min-width: 260px; }
    
    /* Board Settings & Terminal Section */
    .board-meta-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 768px) { .board-meta-controls { grid-template-columns: 1fr; } }
    
    .owner-terminal-box {
      background: #05050a; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; padding: 14px; font-family: monospace; display: flex; flex-direction: column; gap: 8px;
    }
    .terminal-title { color: #f87171; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; }
    .terminal-row { display: flex; gap: 10px; }
    .terminal-input { background: #0a0a14; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; padding: 6px 10px; flex: 1; font-size: 0.8rem; }

    .board-settings-box {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .settings-title { color: var(--gold); font-size: 0.85rem; font-family: 'Syne', sans-serif; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .settings-select { background: #0d0d1b; border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 10px; font-family: 'Manrope', sans-serif; font-size: 0.8rem; cursor: pointer; }

    .suggestions-list { display: flex; flex-direction: column; gap: 14px; }
    .sug-node { background: rgba(255, 255, 255, 0.015); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative; }

    .sug-node.own-perspective, .reply-node.own-perspective { background: #ffffff !important; border-color: #ffffff !important; }
    .sug-node.own-perspective .sug-body, .sug-node.own-perspective .sug-time, .reply-node.own-perspective .sug-body, .reply-node.own-perspective .sug-time, .sug-node.own-perspective .board-action-link, .reply-node.own-perspective .board-action-link, .sug-node.own-perspective .reply-toggle-btn, .reply-node.own-perspective .reply-toggle-btn { color: #111118 !important; }
    
    .sug-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; }
    .owner-sug-text { color: #f87171 !important; font-weight: 600; }
    .staff-sug-text { color: #fb923c !important; font-weight: 600; }
    .sug-author { font-weight: 700; color: var(--gold-soft); }
    .sug-node.own-perspective .sug-author, .reply-node.own-perspective .sug-author { color: #111118 !important; font-weight: 800; }

    .mention-tag {
      background: rgba(212, 175, 55, 0.15); color: var(--gold) !important; padding: 2px 6px; border-radius: 4px; font-weight: 700; border: 1px solid rgba(212, 175, 55, 0.3); font-size: 0.85rem;
    }
    .sug-node.own-perspective .mention-tag, .reply-node.own-perspective .mention-tag {
      background: rgba(17, 17, 24, 0.1); color: #111118 !important; border-color: rgba(17,17,24,0.2);
    }

    .owner-sug-author { color: #f87171 !important; text-shadow: 0 0 8px rgba(248,113,113,0.3); display: inline-flex; align-items: center; gap: 5px; }
    .owner-sug-author::after { content: '👑 OWNER'; font-size: 0.58rem; font-weight: 800; background: rgba(248,113,113,0.15); padding: 1px 5px; border-radius: 3px; border: 1px solid rgba(248,113,113,0.4); color: #f87171; }
    
    .staff-sug-author { color: #fb923c !important; text-shadow: 0 0 8px rgba(251,146,60,0.3); display: inline-flex; align-items: center; gap: 5px; }
    .staff-sug-author::after { content: '🛡️ STAFF'; font-size: 0.58rem; font-weight: 800; background: rgba(251,146,60,0.15); padding: 1px 5px; border-radius: 3px; border: 1px solid rgba(251,146,60,0.3); color: #fb923c; }
    
    .sug-time { color: var(--muted); font-size: 0.72rem; }
    .sug-body { font-size: 0.92rem; color: var(--text); line-height: 1.4; word-break: break-word; }
    
    .replies-box { margin-top: 8px; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .reply-node { background: rgba(255, 255, 255, 0.008); border: 1px solid rgba(255,255,255,0.02); border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; position: relative; display: flex; flex-direction: column; gap: 4px; }
    .reply-node::before { content: "\f3e5"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; left: -18px; top: 12px; font-size: 0.72rem; color: var(--border-h); transform: scaleX(-1); }
    .reply-node.own-perspective::before { color: #ffffff !important; }

    .sug-controls { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .board-action-link { background: none; border: none; font-family: 'Manrope', sans-serif; font-size: 0.72rem; font-weight: 600; cursor: pointer; color: var(--muted); padding: 0; transition: color 0.15s; }
    .board-action-link:hover { color: var(--text); }
    .board-action-link.delete-link:hover { color: #f87171; }

    .reply-toggle-btn { background: none; border: none; color: var(--muted); font-family: 'Manrope', sans-serif; font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; transition: color 0.15s; }
    .reply-toggle-btn:hover { color: var(--gold); }
    .reply-form-sub-panel { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    .admin-add-btn { display: inline-flex; align-items: center; gap: 9px; font-family: 'Manrope', sans-serif; font-size: .87rem; font-weight: 600; padding: 11px 22px; border-radius: 10px; border: 1px solid; cursor: pointer; background: var(--gold); color: #000; border-color: var(--gold); margin-top: 4px; margin-bottom: 24px; }
    .admin-badge { position: fixed; top: calc(var(--nav-h, 58px) + 10px); right: 14px; z-index: 20; }
    .admin-pill { font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 5px 12px; border-radius: 99px; font-family: 'Manrope', sans-serif; border: 1px solid; cursor: pointer; transition: all .15s; }
    .admin-pill.login { color: var(--muted); border-color: var(--border); background: none; }
    .admin-pill.login:hover { color: var(--sub); border-color: var(--border-h); background: rgba(255,255,255,.04); }
    .admin-pill.active-owner { color: #f87171; border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.1); }
    .admin-pill.active-staff { color: #fb923c; border-color: rgba(251,146,60,0.35); background: rgba(251,146,60,0.1); }

    .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 94%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<div class="wrap">
  <header class="page-header">
    <div class="chip"><span class="chip-dot" style="background:#ef4444"></span>Broadcast Studio</div>
    <h1 class="page-title">Live Streams</h1>
    <p class="page-sub">Track currently airing broadcasts, upcoming schedules, and explore older stream vaults.</p>
  </header>

  <div class="stream-tabs">
    <button class="tab-btn active" id="tabBtnLive" onclick="switchTab('live')"><i class="fa-solid fa-circle-radial"></i> Live Now <span class="tab-pulse-indicator" id="livePulseAlert"></span></button>
    <button class="tab-btn" id="tabBtnPremieres" onclick="switchTab('premieres')"><i class="fa-solid fa-film"></i> Premieres</button>
    <button class="tab-btn" id="tabBtnSuggestions" onclick="switchTab('suggestions')"><i class="fa-solid fa-lightbulb"></i> Stream & Premiere Suggestions <span class="tab-counter-badge" id="sugCounterCircle">0</span></button>
    <button class="tab-btn" id="tabBtnUpcoming" onclick="switchTab('upcoming')"><i class="fa-solid fa-calendar-days"></i> Upcoming Scheduled</button>
    <button class="tab-btn" id="tabBtnPast" onclick="switchTab('past')"><i class="fa-solid fa-clock-rotate-left"></i> Past Streams</button>
  </div>

  <div id="adminButtonContainer"></div>
  <div class="streams-container" id="streamsContainer"></div>
</div>

<div class="admin-badge">
  <button class="admin-pill login" id="adminBtn"><i class="fa-solid fa-shield-halved"></i> Admin</button>
</div>

<div class="modal-overlay" id="adminLoginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('adminLoginModal')">×</button>
    <h3>Admin Login</h3>
    <label>Username</label>
    <input type="text" id="adminUser" autocomplete="off">
    <label>Password</label>
    <input type="password" id="adminPass" autocomplete="off">
    <div class="modal-error" id="adminError" style="font-size:.78rem;color:#f87171;margin-top:10px;min-height:18px;"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('adminLoginModal')">Cancel</button>
      <button class="btn-confirm" id="adminLoginBtn">Login</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="streamModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('streamModal')">×</button>
    <h3><span id="modalTitle">Add Stream Event</span></h3>
    <label>Stream / Premiere Title</label>
    <input type="text" id="streamTitle" maxlength="100">
    <label>Description</label>
    <textarea id="streamDescription" rows="3" maxlength="400"></textarea>
    <label>YouTube Video ID</label>
    <input type="text" id="streamVideoId">
    <label>Status Tier</label>
    <select id="streamStatus">
      <option value="live">🔴 Live Now</option>
      <option value="premieres">🎬 Premiere Section</option>
      <option value="upcoming">⏳ Upcoming Live Event</option>
      <option value="past">🎬 Past Broadcast Vault</option>
    </select>
    <label>Schedule Target Date/Time</label>
    <input type="datetime-local" id="streamTargetDate">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('streamModal')">Cancel</button>
      <button class="btn-confirm" id="streamSaveBtn">Save Entry</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editIdeaModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('editIdeaModal')">×</button>
    <h3>Modify Text Entry</h3>
    <label>Suggestion Message Content</label>
    <textarea id="editIdeaContent" rows="4" maxlength="400"></textarea>
    <input type="hidden" id="editIdeaTargetId">
    <input type="hidden" id="editIdeaParentId">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('editIdeaModal')">Cancel</button>
      <button class="btn-confirm" onclick="saveIdeaEditModification()">Apply Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_KEY = 'AIzaSyAYdcohjswp3jcgWZgDFTwYiZsMwSeLrwY';
  const CHANNEL_ID = 'UCi8DgxMDGJ-Qsjqfdi-uoIw';
  const STORAGE_KEY = 'tuw_streams_data_v2';
  const BOARD_STORAGE_KEY = 'tuw_stream_board_ideas';
  const SETTINGS_STORAGE_KEY = 'tuw_stream_board_settings';
  
  const OWNER_USER = 'Ethan Ioannou';
  const OWNER_PASS = 'leonisGOAT';
  const STAFF_USER = 'admin';
  const STAFF_PASS = 'goodpassword';
  
  let STREAMS = [];
  let BOARD_IDEAS = [];
  let currentTab = 'live';
  let isAdmin = false;
  let adminRole = ''; 
  let editingId = null;
  let countdownInterval = null;

  // Counter badge computation metric selector
  let counterConfigMode = 'all'; 

  const USER_SESSION_POSTS = new Set();

  async function loadAllStreamsPipeline() {
    let localSaved = [];
    try { const stored = localStorage.getItem(STORAGE_KEY); localSaved = stored ? JSON.parse(stored) : []; } catch(e) { localSaved = []; }
    STREAMS = localSaved.filter(s => s.status === 'past');
    const adminManualOverrides = localSaved.filter(s => s.status !== 'past');

    try { const boardStored = localStorage.getItem(BOARD_STORAGE_KEY); BOARD_IDEAS = boardStored ? JSON.parse(boardStored) : []; } catch(e) { BOARD_IDEAS = []; }
    try { const settingsStored = localStorage.getItem(SETTINGS_STORAGE_KEY); counterConfigMode = settingsStored || 'all'; } catch(e) { counterConfigMode = 'all'; }

    updateSuggestionsCounterBadge();

    if(!API_KEY || API_KEY.includes('PASTE_YOUR_')) {
      STREAMS = [...adminManualOverrides, ...STREAMS]; evaluateLiveStatusDot(); renderStreams(); return;
    }

    try {
      const liveRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=live&key=${API_KEY}`);
      const liveData = await liveRes.json();
      if(liveData.items) {
        liveData.items.forEach((item, i) => { STREAMS.push({ id: 'live-' + i + Date.now(), title: item.snippet.title, description: item.snippet.description, videoId: item.id.videoId, status: 'live', targetDate: '', isPremiere: false }); });
      }
    } catch(err) {}

    adminManualOverrides.forEach(m => { if(!STREAMS.some(a => a.videoId === m.videoId)) STREAMS.push(m); });
    evaluateLiveStatusDot();
    renderStreams();
  }

  function saveLocalState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(STREAMS)); evaluateLiveStatusDot(); }
  function saveBoardState() { localStorage.setItem(BOARD_STORAGE_KEY, JSON.stringify(BOARD_IDEAS)); updateSuggestionsCounterBadge(); }
  function saveSettingsState() { localStorage.setItem(SETTINGS_STORAGE_KEY, counterConfigMode); updateSuggestionsCounterBadge(); }

  function canModifySuggestionRecord(itemRole, itemId) {
    if (isAdmin && adminRole === 'OWNER') return true; 
    if (isAdmin && adminRole === 'STAFF') return itemRole !== 'OWNER'; 
    return USER_SESSION_POSTS.has(itemId);
  }

  function updateSuggestionsCounterBadge() {
    const badge = document.getElementById('sugCounterCircle');
    if(!badge) return;

    if (counterConfigMode === 'off') {
      badge.style.opacity = '0';
      badge.textContent = '0';
      return;
    }
    
    badge.style.opacity = '1';
    let currentUsername = isAdmin ? ((adminRole === 'OWNER') ? 'EthanUnlocked' : 'TUW Admin') : '';
    let count = 0;

    BOARD_IDEAS.forEach(idea => {
      if (idea.isBanned) return;

      if (counterConfigMode === 'all') {
        count++;
      } else if (counterConfigMode === 'personal' && currentUsername) {
        // Mode Personal: Scan if post text explicitly mentions current authenticated user handle
        if (idea.text.toLowerCase().includes(`@${currentUsername.toLowerCase()}`)) {
          count++;
        }
      }

      if (idea.replies) {
        idea.replies.forEach(reply => {
          if (counterConfigMode === 'all') {
            count++;
          } else if (counterConfigMode === 'personal' && currentUsername) {
            // Check if user is explicitly mentioned in reply or if reply is an answer to a post they wrote
            const isMentioned = reply.text.toLowerCase().includes(`@${currentUsername.toLowerCase()}`);
            const isReplyToThem = idea.name.toLowerCase() === currentUsername.toLowerCase();
            if (isMentioned || isReplyToThem) {
              count++;
            }
          }
        });
      }
    });

    badge.textContent = count;
  }

  function parseMentionHighlights(text) {
    return text.replace(/@(\w+(\s+\w+)?)/g, '<span class="mention-tag">@$1</span>');
  }

  function renderStreams() {
    const container = document.getElementById('streamsContainer');
    if (!container) return;

    if(currentTab === 'suggestions') {
      let defaultInputValue = isAdmin ? ((adminRole === 'OWNER') ? 'EthanUnlocked' : 'TUW Admin') : '';
      
      let ownerTerminalElement = (isAdmin && adminRole === 'OWNER') ? `
        <div class="owner-terminal-box">
          <div class="terminal-title">👑 OWNER MODERATION COMMAND SYSTEM</div>
          <div class="terminal-row">
            <input type="text" class="terminal-input" id="ownerCmdInput" placeholder="Type /ban <username> and press Enter..." onkeydown="handleOwnerTerminalExecution(event)">
          </div>
        </div>` : '';

      container.innerHTML = `
        <div class="tab-board-card">
          <p class="board-header"><i class="fa-solid fa-lightbulb"></i> Stream & Premiere Suggestions Box</p>
          
          <div class="board-meta-controls">
            ${ownerTerminalElement}
            <div class="board-settings-box">
              <div class="settings-title"><i class="fa-solid fa-sliders"></i> Counter Badge Options</div>
              <select class="settings-select" id="counterSettingSelect" onchange="updateCounterSettingFilter(this.value)">
                <option value="all" ${counterConfigMode === 'all' ? 'selected' : ''}>Every single post and reply</option>
                <option value="personal" ${counterConfigMode === 'personal' ? 'selected' : ''}>Only replies to me or mentions</option>
                <option value="off" ${counterConfigMode === 'off' ? 'selected' : ''}>Turn counter badge completely off</option>
              </select>
            </div>
          </div>

          <div class="board-input-group">
            <div class="board-row-inputs">
              <input type="text" class="board-input input-name" id="globalSugName" placeholder="Your Username..." value="${defaultInputValue}" ${isAdmin ? 'disabled' : ''}>
              <input type="text" class="board-input input-msg" id="globalSugMsg" placeholder="Type your suggestion here...">
            </div>
            <button class="board-submit-btn" onclick="submitGlobalSuggestion()">Post Idea</button>
          </div>
          <div class="suggestions-list">
            ${BOARD_IDEAS.filter(msg => !msg.isBanned).length === 0 ? '<div class="no-streams">No suggestions found.</div>' : 
              BOARD_IDEAS.map(msg => {
                if (msg.isBanned) return '';
                let authorClass = msg.role === 'OWNER' ? 'owner-sug-author' : (msg.role === 'STAFF' ? 'staff-sug-author' : '');
                let textClass = msg.role === 'OWNER' ? 'owner-sug-text' : (msg.role === 'STAFF' ? 'staff-sug-text' : '');
                let perspectiveClass = USER_SESSION_POSTS.has(msg.id) ? 'own-perspective' : '';

                return `
                  <div class="sug-node ${perspectiveClass}">
                    <div class="sug-meta">
                      <span class="sug-author ${authorClass}">${msg.name}</span>
                      <span class="sug-time">${msg.time}</span>
                    </div>
                    <p class="sug-body ${textClass}">${parseMentionHighlights(msg.text)}</p>
                    <div class="sug-controls">
                      ${canModifySuggestionRecord(msg.role, msg.id) ? `
                        <button class="board-action-link" onclick="openIdeaEditModal('${msg.id}', null, '${msg.text.replace(/'/g, "\\'")}')">Edit</button>
                        <button class="board-action-link delete-link" onclick="deleteSuggestionRecord('${msg.id}', null)">Delete</button>
                      ` : ''}
                      ${(isAdmin && adminRole === 'OWNER') ? `<button class="board-action-link delete-link" style="color:#ef4444;" onclick="banSuggestionRecord('${msg.id}', null)">Owner-Ban</button>` : ''}
                    </div>
                    <div class="replies-box">
                      ${(msg.replies || []).map(rep => `
                        <div class="reply-node ${USER_SESSION_POSTS.has(rep.id) ? 'own-perspective' : ''}">
                          <div class="sug-meta">
                            <span class="sug-author ${rep.role === 'OWNER' ? 'owner-sug-author' : (rep.role === 'STAFF' ? 'staff-sug-author' : '')}">${rep.name}</span>
                            <span class="sug-time">${rep.time}</span>
                          </div>
                          <p class="sug-body ${rep.role === 'OWNER' ? 'owner-sug-text' : (rep.role === 'STAFF' ? 'staff-sug-text' : '')}">${parseMentionHighlights(rep.text)}</p>
                          <div class="sug-controls">
                            ${canModifySuggestionRecord(rep.role, rep.id) ? `
                              <button class="board-action-link" onclick="openIdeaEditModal('${rep.id}', '${msg.id}', '${rep.text.replace(/'/g, "\\'")}')">Edit</button>
                              <button class="board-action-link delete-link" onclick="deleteSuggestionRecord('${rep.id}', '${msg.id}')">Delete</button>
                            ` : ''}
                            ${(isAdmin && adminRole === 'OWNER') ? `<button class="board-action-link delete-link" style="color:#ef4444;" onclick="banSuggestionRecord('${rep.id}', '${msg.id}')">Owner-Ban</button>` : ''}
                          </div>
                        </div>
                      `).join('')}
                    </div>
                    <button class="reply-toggle-btn" onclick="toggleReplyInput(this)"><i class="fa-solid fa-reply"></i> Reply</button>
                    <div class="reply-form-sub-panel" style="display:none;">
                      <input type="text" class="board-input reply-user-name" value="${defaultInputValue}" ${isAdmin ? 'disabled' : ''} style="width:120px;">
                      <input type="text" class="board-input reply-user-msg" placeholder="Write response...">
                      <button class="board-submit-btn" onclick="submitSubReply('${msg.id}', this)">Post</button>
                    </div>
                  </div>`;
              }).join('')
            }
          </div>
        </div>`;
      return;
    }

    const filtered = STREAMS.filter(s => s.status === currentTab);
    if(filtered.length === 0) { container.innerHTML = `<div class="no-streams">No listings active.</div>`; return; }
    container.innerHTML = filtered.map(s => `<div class="stream-item"><div class="stream-title">${s.title}</div></div>`).join('');
  }

  function updateCounterSettingFilter(value) {
    counterConfigMode = value;
    saveSettingsState();
  }

  function submitGlobalSuggestion() {
    const msgInput = document.getElementById('globalSugMsg');
    const nameInput = document.getElementById('globalSugName');
    if(!msgInput || !msgInput.value.trim()) return;

    let authorName = isAdmin ? ((adminRole === 'OWNER') ? 'EthanUnlocked' : 'TUW Admin') : (nameInput.value.trim() || 'Anonymous');
    const uniqueId = 'sug-' + Date.now();

    BOARD_IDEAS.unshift({ id: uniqueId, name: authorName, text: msgInput.value.trim(), role: isAdmin ? adminRole : 'USER', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), replies: [], isBanned: false });
    USER_SESSION_POSTS.add(uniqueId);
    saveBoardState(); msgInput.value = ''; renderStreams();
  }

  function submitSubReply(parentId, btnNode) {
    const wrapper = btnNode.parentElement;
    const msgVal = wrapper.querySelector('.reply-user-msg').value.trim();
    if(!msgVal) return;
    
    let authorName = isAdmin ? ((adminRole === 'OWNER') ? 'EthanUnlocked' : 'TUW Admin') : (wrapper.querySelector('.reply-user-name').value.trim() || 'Anonymous');
    const uniqueReplyId = 'rep-' + Date.now();
    const match = BOARD_IDEAS.find(idea => idea.id === parentId);
    
    if(match) {
      if(!match.replies) match.replies = [];
      match.replies.push({ id: uniqueReplyId, name: authorName, text: msgVal, role: isAdmin ? adminRole : 'USER', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      USER_SESSION_POSTS.add(uniqueReplyId);
      saveBoardState(); renderStreams();
    }
  }

  function handleOwnerTerminalExecution(e) {
    if(e.key !== 'Enter') return;
    const input = document.getElementById('ownerCmdInput');
    const rawCmd = input.value.trim();
    if(!rawCmd) return;

    const parts = rawCmd.split(' ');
    const command = parts[0].toLowerCase();
    const targetUser = parts[1];

    if(command === '/ban' && targetUser) {
      BOARD_IDEAS.forEach(idea => {
        if(idea.name.toLowerCase() === targetUser.toLowerCase() && idea.role !== 'OWNER') {
          idea.isBanned = true;
          idea.replies = [];
        }
      });
      saveBoardState(); renderStreams();
      showToast(`Command processed: Hidden posts from ${targetUser}. Email log execution simulated.`);
    }
    input.value = '';
  }

  function openIdeaEditModal(targetId, parentId, textVal) { document.getElementById('editIdeaContent').value = textVal; document.getElementById('editIdeaTargetId').value = targetId; document.getElementById('editIdeaParentId').value = parentId || ''; openModal('editIdeaModal'); }
  
  function saveIdeaEditModification() {
    const targetId = document.getElementById('editIdeaTargetId').value;
    const parentId = document.getElementById('editIdeaParentId').value;
    const newText = document.getElementById('editIdeaContent').value.trim();
    if(!newText) return;

    if(!parentId) {
      const match = BOARD_IDEAS.find(x => x.id === targetId); if(match) match.text = newText;
    } else {
      const rootMatch = BOARD_IDEAS.find(x => x.id === parentId);
      if(rootMatch?.replies) { const subMatch = rootMatch.replies.find(y => y.id === targetId); if(subMatch) subMatch.text = newText; }
    }
    saveBoardState(); closeModal('editIdeaModal'); renderStreams();
  }

  function deleteSuggestionRecord(targetId, parentId) {
    if(!confirm('Delete this message entry?')) return;
    if(!parentId) { BOARD_IDEAS = BOARD_IDEAS.filter(x => x.id !== targetId); } 
    else { const rootMatch = BOARD_IDEAS.find(x => x.id === parentId); if(rootMatch?.replies) rootMatch.replies = rootMatch.replies.filter(y => y.id !== targetId); }
    saveBoardState(); renderStreams();
  }

  function banSuggestionRecord(targetId, parentId) {
    if(!parentId) {
      const match = BOARD_IDEAS.find(x => x.id === targetId); if(match) match.isBanned = true;
    } else {
      const rootMatch = BOARD_IDEAS.find(x => x.id === parentId);
      if(rootMatch?.replies) rootMatch.replies = rootMatch.replies.filter(y => y.id !== targetId);
    }
    saveBoardState(); renderStreams(); showToast('Post hidden. Notification email logged.');
  }

  function setAdmin(val, role = '') {
    isAdmin = val; adminRole = val ? role : '';
    const btn = document.getElementById('adminBtn');
    const container = document.getElementById('adminButtonContainer');
    if (val) {
      btn.className = adminRole === 'OWNER' ? 'admin-pill active-owner' : 'admin-pill active-staff';
      btn.innerHTML = adminRole === 'OWNER' ? 'Owner ✓' : 'Staff ✓';
      if(container) container.innerHTML = `<button class="admin-add-btn" onclick="addStream()">+ Add Entry</button>`;
    } else {
      btn.className = 'admin-pill login'; btn.innerHTML = 'Admin'; if(container) container.innerHTML = '';
    }
    renderStreams();
  }

  function handleLogin() {
    const u = document.getElementById('adminUser').value.trim(); const p = document.getElementById('adminPass').value;
    if (u === OWNER_USER && p === OWNER_PASS) { closeModal('adminLoginModal'); setAdmin(true, 'OWNER'); showToast('Owner status verified 👑'); } 
    else if (u === STAFF_USER && p === STAFF_PASS) { closeModal('adminLoginModal'); setAdmin(true, 'STAFF'); showToast('Staff authorized.'); } 
    else { document.getElementById('adminError').textContent = 'Invalid account.'; }
  }

  function evaluateLiveStatusDot() { const p = document.getElementById('livePulseAlert'); if(p) p.style.display = STREAMS.some(s => s.status === 'live') ? 'block' : 'none'; }
  function switchTab(t) { currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); if(b.id.toLowerCase().includes(t.toLowerCase())) b.classList.add('active'); }); renderStreams(); }

  window.onload = () => {
    loadAllStreamsPipeline();
    document.getElementById('adminBtn').onclick = () => isAdmin ? setAdmin(false) : openModal('adminLoginModal');
    document.getElementById('adminLoginBtn').onclick = handleLogin;
  };
</script>
</body>
</html>
