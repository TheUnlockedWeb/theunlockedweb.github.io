<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Streams — TheUnlockedWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="icon" href="../assets/resources/favicon.ico">
  <style>
    /* ── Page header ─────────────────────── */
    .page-header {
      padding: 52px 0 30px;
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 12px;
    }
    .page-title {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: clamp(2rem, 7vw, 3.8rem);
      line-height: 1; letter-spacing: -0.03em;
      background: linear-gradient(140deg, #fff 0%, #f5f3ff 20%, var(--gold) 48%, var(--gold-soft) 68%, #fff 88%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 7s .4s linear infinite, fadeUp .7s cubic-bezier(.22,1,.36,1) both;
    }
    .page-sub {
      font-size: .88rem; color: var(--sub); font-weight: 500;
      animation: fadeUp .6s .15s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Stream Tabs Navigation ──────────── */
    .stream-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-wrap: wrap;
      animation: fadeUp .6s .18s cubic-bezier(.22,1,.36,1) both;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-h);
    }
    .tab-btn.active {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--gold);
      color: var(--gold);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    /* Tab Indicator Pulse Alerts */
    .tab-pulse-indicator {
      display: none;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      position: absolute;
      top: 6px;
      right: 6px;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse-glow 1.5s infinite;
    }

    /* ── Streams Container ────────────────── */
    .streams-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeUp .6s .2s cubic-bezier(.22,1,.36,1) both;
    }

    .stream-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: border-color .22s, background .22s, transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s;
    }
    .stream-item:hover {
      border-color: var(--border-h);
      background: var(--card-h);
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
    }

    .stream-top-row {
      display: flex;
      gap: 24px;
    }
    @media (max-width: 768px) {
      .stream-top-row { flex-direction: column; gap: 16px; }
    }

    /* Thumbnail Wrapper */
    .stream-thumb-wrapper {
      position: relative;
      width: 280px;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .stream-thumb-wrapper { width: 100%; }
    }
    .stream-thumb-wrapper img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;
    }
    .stream-item:hover .stream-thumb-wrapper img {
      transform: scale(1.03);
    }
    .live-indicator-tag {
      position: absolute; top: 10px; left: 10px;
      background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 800;
      padding: 3px 8px; border-radius: 4px; letter-spacing: 1px;
      text-transform: uppercase; animation: pulse-glow 1.5s infinite;
    }
    .live-indicator-tag.premiere-tag {
      background: #3b82f6;
    }

    .stream-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stream-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .stream-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-red { background: #ef4444; box-shadow: 0 0 10px #ef4444; animation: pulse-glow 1.5s infinite; }
    .dot-blue { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
    .dot-gold { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
    .dot-muted { background: var(--muted); }

    .stream-title {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.2rem; color: var(--text); flex: 1;
    }

    .stream-status-badge {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    }
    .badge-live { background: rgba(239,68,68,.13); color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .badge-premieres { background: rgba(59,130,246,.13); color: #3b82f6; border: 1px solid rgba(59,130,246,.3); }
    .badge-upcoming { background: rgba(245,158,11,.13); color: var(--gold); border: 1px solid rgba(245,158,11,.3); }
    .badge-completed { background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--border); }

    /* ── Live / Archive Theater Embed Workspace ────── */
    .live-theater-workspace {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #06060c;
    }
    .live-theater-workspace.no-chat {
      grid-template-columns: 1fr;
    }
    @media (max-width: 900px) {
      .live-theater-workspace { grid-template-columns: 1fr; }
    }
    .video-player-frame {
      width: 100%; aspect-ratio: 16/9; background: #000; border: none; display: block;
    }
    .chat-embed-frame {
      width: 100%; height: 100%; min-height: 360px; background: #0a0a14; border: none; display: block;
      border-left: 1px solid var(--border);
    }
    @media (max-width: 900px) {
      .chat-embed-frame { border-left: none; border-top: 1px solid var(--border); height: 400px; }
    }

    /* ── Standalone Tab Suggestions Layout ────────── */
    .tab-board-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 28px;
    }
    .board-header {
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem;
      color: var(--text); margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
    }
    .board-header i { color: var(--gold); }
    .board-sub-label { font-size: 0.82rem; color: var(--sub); margin-bottom: 20px; }
    
    .board-input-group {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;
      background: rgba(255,255,255,0.01); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    }
    .board-row-inputs { display: flex; gap: 10px; flex-wrap: wrap; }
    .board-input {
      background: #0d0d1b; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 10px 14px; font-family: 'Manrope', sans-serif; font-size: 0.85rem;
    }
    .board-input:focus { outline: none; border-color: var(--gold); }
    .input-name { width: 200px; }
    .input-msg { flex: 1; min-width: 260px; }
    
    .board-submit-btn {
      align-self: flex-end; padding: 8px 20px; border-radius: 6px; border: none;
      background: rgba(212, 175, 55, 0.15); color: var(--gold); font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; transition: all 0.15s;
    }
    .board-submit-btn:hover { background: var(--gold); color: #000; }

    .suggestions-list { display: flex; flex-direction: column; gap: 14px; }
    .sug-node {
      background: rgba(255, 255, 255, 0.015); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .sug-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; }
    .sug-author { font-weight: 700; color: var(--gold-soft); }
    .sug-time { color: var(--muted); font-size: 0.72rem; }
    .sug-body { font-size: 0.92rem; color: var(--text); line-height: 1.4; word-break: break-word; }
    
    .replies-box {
      margin-top: 8px; padding-left: 16px; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .reply-node {
      background: rgba(255, 255, 255, 0.008); border: 1px solid rgba(255,255,255,0.02);
      border-radius: 6px; padding: 10px 12px; font-size: 0.85rem;
    }

    /* Administrative Text Highlight Configurations */
    .admin-sug-author {
      color: var(--gold) !important; text-shadow: 0 0 8px rgba(212,175,55,0.3);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .admin-sug-author::after {
      content: '👑 OWNER'; font-size: 0.58rem; font-weight: 800; background: rgba(239,68,68,0.15);
      padding: 1px 5px; border-radius: 3px; border: 1px solid rgba(239,68,68,0.4); color: #ef4444;
    }
    .admin-sug-text { color: var(--gold) !important; font-weight: 500; }

    .reply-toggle-btn {
      background: none; border: none; color: var(--muted); font-family: 'Manrope', sans-serif;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 0; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 4px; transition: color 0.15s;
    }
    .reply-toggle-btn:hover { color: var(--gold); }
    .reply-form-sub-panel { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    /* Countdown Modules */
    .countdown-box {
      background: rgba(212, 175, 55, 0.04);
      border: 1px dashed rgba(212, 175, 55, 0.2);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 12px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .countdown-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--gold); letter-spacing: 0.5px;}
    .countdown-time { font-family: monospace; font-size: 0.95rem; color: #fff; font-weight: 600; }

    .stream-meta { display: flex; align-items: center; gap: 16px; font-size: 0.8rem; color: var(--muted); }
    .watch-link {
      color: var(--gold); font-weight: 700; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .watch-link:hover { text-shadow: 0 0 8px rgba(212,175,55,0.4); color: #fff; }

    /* Controls UI */
    .adm-btn {
      font-size: .68rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
      padding: 3px 8px; border-radius: 6px; border: 1px solid; cursor: pointer;
      font-family: 'Manrope', sans-serif; transition: background .14s, transform .14s;
    }
    .adm-btn:hover { transform: scale(1.04); }
    .adm-btn-edit { background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); color: var(--gold); }
    .adm-btn-edit:hover { background: rgba(245,158,11,.2); }
    .adm-btn-del { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.3); color: #f87171; }
    .adm-btn-del:hover { background: rgba(248,113,113,.22); }

    .admin-add-btn {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: 'Manrope', sans-serif; font-size: .87rem; font-weight: 600;
      padding: 13px 26px; border-radius: 12px; border: 1px solid;
      transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s, background .18s;
      cursor: pointer; background: var(--gold); color: #000; border-color: var(--gold);
      margin-bottom: 28px;
    }
    .admin-add-btn:hover { transform: translateY(-3px); }

    .admin-badge { position: fixed; top: calc(var(--nav-h, 58px) + 10px); right: 14px; z-index: 20; }
    .admin-pill {
      font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      padding: 5px 12px; border-radius: 99px; font-family: 'Manrope', sans-serif;
      border: 1px solid; cursor: pointer; transition: all .15s;
    }
    .admin-pill.login { color: var(--muted); border-color: var(--border); background: none; }
    .admin-pill.login:hover { color: var(--sub); border-color: var(--border-h); background: rgba(255,255,255,.04); }
    .admin-pill.active { color: #ef4444; border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.1); }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.82); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; width: 94%; max-width: 500px;
      position: relative; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--text); margin-bottom: 18px; }
    .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
    .modal label { display: block; font-size: .72rem; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-top: 14px; margin-bottom: 6px; }
    .modal input, .modal textarea, .modal select { width: 100%; background: #0d0d1b; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 12px; font-family: 'Manrope', sans-serif; font-size: .88rem; }
    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
    .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; }
    .btn-confirm { background: var(--gold); color: #000; }
    .btn-cancel { background: rgba(255,255,255,.07); color: var(--sub); }

    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px;
      font-size: .82rem; font-weight: 500; color: var(--text); font-family: 'Manrope', sans-serif;
      z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .no-streams {
      padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--r); font-size: 0.9rem;
    }

    @keyframes pulse-glow {
      0% { opacity: 0.4; transform: scale(0.96); box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
      50% { opacity: 1; transform: scale(1.04); box-shadow: 0 0 14px rgba(239, 68, 68, 0.8); }
      100% { opacity: 0.4; transform: scale(0.96); box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
    }
  </style>
</head>

<script>
  // 1. System Configurations & Security Variables
  const API_KEY = 'AIzaSyAYdcohjswp3jcgWZgDFTwYiZsMwSeLrwY';
  const CHANNEL_ID = 'UCi8DgxMDGJ-Qsjqfdi-uoIw';
  const STORAGE_KEY = 'tuw_streams_data_v2';
  const BOARD_STORAGE_KEY = 'tuw_stream_board_ideas';
  const ADMIN_USER = 'Ethan Ioannou';
  const ADMIN_PASS = 'leonisGOAT';
  
  let STREAMS = [];
  let BOARD_IDEAS = [];
  let currentTab = 'live';
  let isAdmin = false;
  let editingId = null;
  let countdownInterval = null;

  const INITIAL_PAST_STREAMS = [];

  // 2. Storage & Dynamic Fetch API Pipeline
  async function loadAllStreamsPipeline() {
    let localSaved = [];
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      localSaved = stored ? JSON.parse(stored) : INITIAL_PAST_STREAMS;
    } catch(e) { 
      localSaved = INITIAL_PAST_STREAMS; 
    }

    const adminPastStreams = localSaved.filter(s => s.status === 'past');
    const adminManualOverrides = localSaved.filter(s => s.status !== 'past');

    STREAMS = [...adminPastStreams];

    try {
      const boardStored = localStorage.getItem(BOARD_STORAGE_KEY);
      BOARD_IDEAS = boardStored ? JSON.parse(boardStored) : [];
    } catch(e) { BOARD_IDEAS = []; }

    if(!API_KEY || API_KEY.includes('PASTE_YOUR_')) {
      STREAMS = [...adminManualOverrides, ...adminPastStreams];
      evaluateLiveStatusDot();
      renderStreams();
      return;
    }

    try {
      // Fetch 1: Active Live Streams
      const liveRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=live&key=${API_KEY}`);
      const liveData = await liveRes.json();
      
      if(liveData.items && liveData.items.length > 0) {
        liveData.items.forEach((item, i) => {
          STREAMS.push({
            id: 'live-' + i + Date.now(),
            title: item.snippet.title,
            description: item.snippet.description,
            videoId: item.id.videoId,
            status: 'live',
            targetDate: '',
            isPremiere: false
          });
        });
      }

      // Fetch 2: Upcoming Scheduled Streams
      const upRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=upcoming&order=date&key=${API_KEY}`);
      const upData = await upRes.json();

      if(upData.items && upData.items.length > 0) {
        for(let i=0; i < upData.items.length; i++) {
          const item = upData.items[i];
          const vId = item.id.videoId;
          
          let liveScheduledTime = '';
          try {
            const detailRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${vId}&key=${API_KEY}`);
            const detailData = await detailRes.json();
            if(detailData.items && detailData.items[0]?.liveStreamingDetails?.scheduledStartTime) {
              liveScheduledTime = detailData.items[0].liveStreamingDetails.scheduledStartTime;
            }
          } catch(err) { console.error(err); }

          STREAMS.push({
            id: 'upcoming-' + i + Date.now(),
            title: item.snippet.title,
            description: item.snippet.description,
            videoId: vId,
            status: 'upcoming',
            targetDate: liveScheduledTime || item.snippet.publishedAt,
            isPremiere: false
          });
        }
      }

      // Fetch 3: Scan Uploaded Archives for Dynamic Premieres
      const scanRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&order=date&maxResults=8&key=${API_KEY}`);
      const scanData = await scanRes.json();

      if(scanData.items && scanData.items.length > 0) {
        const videoIds = scanData.items.map(item => item.id.videoId).join(',');
        const detailRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${videoIds}&key=${API_KEY}`);
        const detailData = await detailRes.json();

        if(detailData.items) {
          detailData.items.forEach((video) => {
            const lsd = video.liveStreamingDetails;
            if(lsd && lsd.scheduledStartTime && !lsd.actualEndTime) {
              const duplicate = STREAMS.some(s => s.videoId === video.id);
              if(!duplicate) {
                STREAMS.push({
                  id: 'premiere-' + video.id,
                  title: video.snippet.title,
                  description: video.snippet.description,
                  videoId: video.id,
                  status: 'premieres', 
                  targetDate: lsd.scheduledStartTime,
                  isPremiere: true,
                  liveNow: new Date().getTime() >= new Date(lsd.scheduledStartTime).getTime()
                });
              }
            }
          });
        }
      }

      // Fetch 4: Completed Past Streams
      const pastRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=completed&order=date&maxResults=10&key=${API_KEY}`);
      const pastData = await pastRes.json();

      if(pastData.items && pastData.items.length > 0) {
        pastData.items.forEach((item, i) => {
          const alreadyLogged = STREAMS.some(s => s.videoId === item.id.videoId);
          if(!alreadyLogged) {
            STREAMS.push({
              id: 'past-api-' + i + Date.now(),
              title: item.snippet.title,
              description: item.snippet.description,
              videoId: item.id.videoId,
              status: 'past',
              targetDate: '',
              isPremiere: false
            });
          }
        });
      }

    } catch(err) {
      console.error(err);
    }

    adminManualOverrides.forEach(manualItem => {
       const alreadyExists = STREAMS.some(apiItem => apiItem.videoId === manualItem.videoId);
       if(!alreadyExists) STREAMS.push(manualItem);
    });

    evaluateLiveStatusDot();
    renderStreams();
  }

  function saveLocalState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STREAMS));
    evaluateLiveStatusDot();
  }

  function saveBoardState() {
    localStorage.setItem(BOARD_STORAGE_KEY, JSON.stringify(BOARD_IDEAS));
  }

  function evaluateLiveStatusDot() {
    const pulseDot = document.getElementById('livePulseAlert');
    if (!pulseDot) return;
    const isCurrentlyLive = STREAMS.some(s => s.status === 'live');
    pulseDot.style.display = isCurrentlyLive ? 'block' : 'none';
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (toast) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  }

  function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('active');
      if(btn.id.toLowerCase().includes(tabName)) btn.classList.add('active');
    });
    renderStreams();
  }

  // 3. Document Layout Render Engine
  function renderStreams() {
    const container = document.getElementById('streamsContainer');
    if (!container) return;

    if(currentTab === 'suggestions') {
      container.innerHTML = `
        <div class="tab-board-card">
          <p class="board-header"><i class="fa-solid fa-lightbulb"></i> Stream & Premiere Suggestions Box</p>
          <p class="board-sub-label">Submit level requests, content ideas, or game challenge recommendations for upcoming streams and premieres.</p>
          
          <div class="board-input-group">
            <div class="board-row-inputs">
              <input type="text" class="board-input input-name" id="globalSugName" placeholder="Your Username..." value="${isAdmin ? 'EthanUnlocked' : ''}" ${isAdmin ? 'disabled' : ''}>
              <input type="text" class="board-input input-msg" id="globalSugMsg" placeholder="Type your stream or premiere suggestion here...">
            </div>
            <button class="board-submit-btn" onclick="submitGlobalSuggestion()">Post Idea</button>
          </div>

          <div class="suggestions-list">
            ${BOARD_IDEAS.length === 0 ? '<div class="no-streams" style="padding:20px;">No records posted yet. Be the first to drop an idea!</div>' : 
              BOARD_IDEAS.map(msg => {
                const authorAdminClass = msg.isAdminInput ? 'admin-sug-author' : '';
                const bodyAdminClass = msg.isAdminInput ? 'admin-sug-text' : '';
                return `
                  <div class="sug-node">
                    <div class="sug-meta">
                      <span class="sug-author ${authorAdminClass}">${msg.name}</span>
                      <span class="sug-time">${msg.time}</span>
                    </div>
                    <p class="sug-body ${bodyAdminClass}">${msg.text}</p>
                    
                    <div class="replies-box">
                      ${(msg.replies || []).map(rep => `
                        <div class="reply-node">
                          <div class="sug-meta" style="margin-bottom:3px;">
                            <span class="sug-author ${rep.isAdminInput ? 'admin-sug-author' : ''}">${rep.name}</span>
                            <span class="sug-time">${rep.time}</span>
                          </div>
                          <p class="sug-body ${rep.isAdminInput ? 'admin-sug-text' : ''}" style="font-size:0.85rem;">${rep.text}</p>
                        </div>
                      `).join('')}
                    </div>

                    <button class="reply-toggle-btn" onclick="toggleReplyInput(this)"><i class="fa-solid fa-reply"></i> Reply</button>
                    <div class="reply-form-sub-panel" style="display:none;">
                      <input type="text" class="board-input reply-user-name" placeholder="Name..." style="width:120px;" value="${isAdmin ? 'EthanUnlocked' : ''}" ${isAdmin ? 'disabled' : ''}>
                      <input type="text" class="board-input reply-user-msg" placeholder="Write response...">
                      <button class="board-submit-btn" style="align-self:center;" onclick="submitSubReply('${msg.id}', this)">Post</button>
                    </div>
                  </div>
                `;
              }).join('')
            }
          </div>
        </div>
      `;
      return;
    }

    const filtered = STREAMS.filter(s => s.status === currentTab);
    if(filtered.length === 0) {
      container.innerHTML = `<div class="no-streams">No active items logged under this category tab view.</div>`;
      return;
    }

    container.innerHTML = filtered.map((s) => {
      const watchUrl = `https://www.youtube.com/watch?v=${s.videoId}`;
      const thumbUrl = s.videoId ? `https://img.youtube.com/vi/${s.videoId}/maxresdefault.jpg` : '../assets/resources/fallback-thumb.jpg';
      const hostname = window.location.hostname || 'localhost';
      
      let badgeClass = `badge-${s.status}`;
      let indicatorDot = s.status === 'live' ? 'dot-red' : (s.status === 'upcoming' ? 'dot-gold' : 'dot-muted');
      let badgeLabel = s.status === 'live' ? 'LIVE NOW' : (s.status === 'upcoming' ? 'UPCOMING' : s.status);
      
      if(s.isPremiere) {
        indicatorDot = s.liveNow ? 'dot-red' : 'dot-blue';
        badgeClass = s.liveNow ? 'badge-live' : 'badge-premieres';
        badgeLabel = s.liveNow ? 'PREMIERE LIVE' : 'SCHEDULED PREMIERE';
      }

      let countdownElement = '';
      if((s.status === 'upcoming' || (s.isPremiere && !s.liveNow)) && s.targetDate) {
        countdownElement = `
          <div class="countdown-box" data-target="${s.targetDate}">
            <span class="countdown-label"><i class="fa-regular fa-hourglass-start"></i> Launches In:</span>
            <span class="countdown-time">Calculating...</span>
          </div>
        `;
      }

      let theaterWorkspaceElement = '';
      if(s.videoId) {
        if (s.status === 'live' || (s.isPremiere && s.liveNow)) {
          theaterWorkspaceElement = `
            <div class="live-theater-workspace">
              <iframe class="video-player-frame" 
                      src="https://www.youtube.com/embed/${s.videoId}?autoplay=1&mute=1" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      allowfullscreen>
              </iframe>
              <iframe class="chat-embed-frame" 
                      src="https://www.youtube.com/live_chat?v=${s.videoId}&embed_domain=${hostname}">
              </iframe>
            </div>
          `;
        } else {
          theaterWorkspaceElement = `
            <div class="live-theater-workspace no-chat">
              <iframe class="video-player-frame" 
                      src="https://www.youtube.com/embed/${s.videoId}" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      allowfullscreen>
              </iframe>
            </div>
          `;
        }
      }

      return `
        <div class="stream-item">
          <div class="stream-top-row">
            <div class="stream-thumb-wrapper">
              ${s.status === 'live' || (s.isPremiere && s.liveNow) ? `<span class="live-indicator-tag ${s.isPremiere ? 'premiere-tag' : ''}">${s.isPremiere ? 'PREMIERE' : 'LIVE'}</span>` : ''}
              <img src="${thumbUrl}" alt="Thumbnail" onerror="this.src='https://img.youtube.com/vi/${s.videoId}/hqdefault.jpg'">
            </div>
            <div class="stream-content">
              <div>
                <div class="stream-header">
                  <div class="stream-dot ${indicatorDot}"></div>
                  <div class="stream-title">${s.title}</div>
                  <span class="stream-status-badge ${badgeClass}">${badgeLabel}</span>
                  ${isAdmin ? `
                  <div class="stream-actions">
                    <button class="adm-btn adm-btn-edit" onclick="editStream('${s.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="adm-btn adm-btn-del" onclick="deleteStream('${s.id}')"><i class="fa-solid fa-trash"></i></button>
                  </div>` : ''}
                </div>
                <p class="stream-description">${s.description}</p>
              </div>
              
              <div>
                ${countdownElement}
                <div class="stream-meta">
                  <a href="${watchUrl}" class="watch-link" target="_blank">
                    <i class="fa-brands fa-youtube"></i> View directly on YouTube →
                  </a>
                </div>
              </div>
            </div>
          </div>
          ${theaterWorkspaceElement}
        </div>
      `;
    }).join('');

    if(currentTab === 'upcoming' || currentTab === 'premieres') startCountdownEngine();
  }

  // 4. Standalone Global Board Data Handlers
  function submitGlobalSuggestion() {
    const msgInput = document.getElementById('globalSugMsg');
    const nameInput = document.getElementById('globalSugName');
    if(!msgInput || !msgInput.value.trim()) return;

    const authorName = isAdmin ? 'EthanUnlocked' : (nameInput.value.trim() || 'Anonymous');

    const newSuggestion = {
      id: 'sug-' + Date.now() + Math.random().toString(36).substr(2, 4),
      name: authorName,
      text: msgInput.value.trim(),
      isAdminInput: isAdmin,
      time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + new Date().toLocaleDateString([], {month:'short', day:'numeric'}),
      replies: []
    };

    BOARD_IDEAS.unshift(newSuggestion);
    saveBoardState();
    msgInput.value = '';
    renderStreams();
    showToast('Suggestion added to board!');
  }

  function toggleReplyInput(btn) {
    const panel = btn.nextElementSibling;
    panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
  }

  function submitSubReply(parentId, btnNode) {
    const wrapper = btnNode.parentElement;
    const nameVal = wrapper.querySelector('.reply-user-name').value.trim();
    const msgVal = wrapper.querySelector('.reply-user-msg').value.trim();

    if(!msgVal) return;
    const authorName = isAdmin ? 'EthanUnlocked' : (nameVal || 'Anonymous');

    const match = BOARD_IDEAS.find(idea => idea.id === parentId);
    if(match) {
      if(!match.replies) match.replies = [];
      match.replies.push({
        name: authorName,
        text: msgVal,
        isAdminInput: isAdmin,
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      });
      saveBoardState();
      renderStreams();
      showToast('Reply published successfully!');
    }
  }

  // 5. Countdown Engine
  function startCountdownEngine() {
    if(countdownInterval) clearInterval(countdownInterval);

    const updateClocks = () => {
      const boxes = document.querySelectorAll('.countdown-box');
      boxes.forEach(box => {
        const targetStr = box.getAttribute('data-target');
        if(!targetStr) return;

        const target = new Date(targetStr).getTime();
        const now = new Date().getTime();
        const diff = target - now;
        const timeDisplay = box.querySelector('.countdown-time');

        if(diff <= 0) {
          timeDisplay.textContent = "Broadcast Active!";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        let parts = [];
        if(days > 0) parts.push(`${days}d`);
        if(hours > 0 || days > 0) parts.push(`${hours}h`);
        parts.push(`${minutes}m`);
        parts.push(`${seconds}s`);

        timeDisplay.textContent = parts.join(' ');
      });
    };

    updateClocks();
    countdownInterval = setInterval(updateClocks, 1000);
  }

  // 6. Admin State Controllers
  function setAdmin(val) {
    isAdmin = val;
    const btn = document.getElementById('adminBtn');
    const container = document.getElementById('adminButtonContainer');
    if (val) {
      if(btn) { btn.className = 'admin-pill active'; btn.innerHTML = 'Owner ✓'; }
      if(container) container.innerHTML = `<button class="admin-add-btn" onclick="addStream()">+ Add Entry</button>`;
    } else {
      if(btn) { btn.className = 'admin-pill login'; btn.innerHTML = 'Admin'; }
      if(container) container.innerHTML = '';
    }
    renderStreams();
  }

  function handleLogin() {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      closeModal('adminLoginModal');
      setAdmin(true);
      showToast('Welcome back, Ethan unlocked! 🛡️');
    } else {
      const err = document.getElementById('adminError');
      if(err) err.textContent = 'Invalid credentials configurations.';
    }
  }

  function addStream() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Entry';
    document.getElementById('streamTitle').value = '';
    document.getElementById('streamDescription').value = '';
    document.getElementById('streamVideoId').value = '';
    document.getElementById('streamStatus').value = (currentTab === 'suggestions') ? 'live' : currentTab;
    document.getElementById('streamTargetDate').value = '';
    openModal('streamModal');
  }

  function editStream(id) {
    const target = STREAMS.find(s => s.id === id || s.id == id);
    if (!target) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Entry';
    document.getElementById('streamTitle').value = target.title;
    document.getElementById('streamDescription').value = target.description;
    document.getElementById('streamVideoId').value = target.videoId;
    document.getElementById('streamStatus').value = target.status;
    
    if(target.targetDate && target.targetDate.includes('Z')) {
       document.getElementById('streamTargetDate').value = new Date(target.targetDate).toISOString().slice(0, 16);
    } else {
       document.getElementById('streamTargetDate').value = target.targetDate || '';
    }
    openModal('streamModal');
  }

  function deleteStream(id) {
    if (confirm('Drop tracking target identifier completely? 🗑️')) {
      STREAMS = STREAMS.filter(s => s.id !== id && s.id != id);
      saveLocalState();
      renderStreams();
      showToast('Asset dropped.');
    }
  }

  // 7. Core Initialization Hook
  window.onload = () => {
    loadAllStreamsPipeline();

    const pill = document.getElementById('adminBtn');
    if(pill) pill.onclick = () => isAdmin ? setAdmin(false) : openModal('adminLoginModal');
    
    const loginConfirm = document.getElementById('adminLoginBtn');
    if(loginConfirm) loginConfirm.onclick = handleLogin;

    const streamSaveBtn = document.getElementById('streamSaveBtn');
    if(streamSaveBtn) {
      streamSaveBtn.onclick = () => {
        const title = document.getElementById('streamTitle').value.trim();
        const desc = document.getElementById('streamDescription').value.trim();
        const vId = document.getElementById('streamVideoId').value.trim();
        const status = document.getElementById('streamStatus').value;
        const targetDate = document.getElementById('streamTargetDate').value;

        if(!title || !vId) {
          showToast('Title and Video ID metrics are mandatory fields.');
          return;
        }

        const isPrem = status === 'premieres' || title.toLowerCase().includes('premiere');

        if(editingId === null) {
          STREAMS.push({ 
            id: Date.now(), title, description: desc, videoId: vId, status, targetDate, 
            isPremiere: isPrem, 
            liveNow: isPrem && targetDate && (new Date().getTime() >= new Date(targetDate).getTime())
          });
        } else {
          const match = STREAMS.find(x => x.id === editingId || x.id == editingId);
          if(match) {
            match.title = title; match.description = desc; match.videoId = vId; match.status = status; match.targetDate = targetDate;
            match.isPremiere = isPrem;
            match.liveNow = isPrem && targetDate && (new Date().getTime() >= new Date(targetDate).getTime());
          }
        }

        saveLocalState();
        closeModal('streamModal');
        renderStreams();
        showToast('Local state synced! 💾');
      };
    }
  };
</script>
</body>
